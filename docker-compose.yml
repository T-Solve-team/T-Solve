services:
  db:
    image: pgvector/pgvector:pg16      # PostgreSQL + pgvector (needed later for semantic search)
    container_name: tsolve-db
    environment:
      POSTGRES_DB: tsolve
      POSTGRES_USER: tsolve
      POSTGRES_PASSWORD: tsolve
    ports:
      - "5432:5432"
    volumes:
      - tsolve-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsolve -d tsolve"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: tsolve-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tsolve-db-data:
