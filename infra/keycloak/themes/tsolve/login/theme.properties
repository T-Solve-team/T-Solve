parent=base
import=common/keycloak
# No stylesCommon and no scripts: the pages load only tsolve.css (AC-001.68).
styles=css/tsolve.css
stylesCommon=
scripts=
# Fallback for "Back to sign-in" when Keycloak does not know the client. Set TSOLVE_WEB_BASE_URL per environment
# (prod: https://tsolve.io.vn/).
backToSignInUrl=${env.TSOLVE_WEB_BASE_URL:http://localhost:5173/}
