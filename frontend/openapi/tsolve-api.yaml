openapi: 3.1.0
info:
  title: T-Solve API
  version: 0.2.0-review
  description: >
    Review endpoints implement Report 3 v3460 (UC-29, UC-30). Session endpoints remain integration
    contracts awaiting the identity module. Errors use Problem Details with an MSG code; paging uses
    Spring Page metadata. Real authentication, session/CSRF transport, Project authorization and email
    delivery require their documented integration adapters.
tags:
  - name: session
    description: Who is signed in.
  - name: review
    description: Review Queue and review decisions (SRS III.7).
paths:
  /api/v1/me:
    get:
      tags: [session]
      operationId: getMe
      summary: The signed-in user, their role, Projects and Departments.
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/logout:
    post:
      tags: [session]
      operationId: logout
      summary: Ends the session (the backend clears the session cookie).
      responses:
        '204':
          description: Signed out.
  /api/v1/review-queue:
    get:
      tags: [review]
      operationId: getReviewQueue
      summary: Pending review Solution Form tickets of the signed-in Project Manager (UC-29).
      parameters:
        - name: projectId
          in: query
          description: One managed Project; omitted = all Projects currently managed by the reviewer.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: One page of the queue. Default sort reviewDueDate,asc.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQueuePage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/review-queue/ticket-ids:
    get:
      tags: [review]
      operationId: getReviewQueueTicketIds
      summary: Ids of every ticket in the queue, for "Select all" (all pages, not only the one shown).
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: All ticket ids in the queue for the filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketIdList'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/reviews/approve:
    post:
      tags: [review]
      operationId: approveTickets
      summary: Approves and publishes the tickets (MSG14).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveTicketsRequest'
      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDecisionResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/reviews/reject:
    post:
      tags: [review]
      operationId: rejectTickets
      summary: Rejects the tickets with one reason (MSG15 confirm, MSG16 result).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectTicketsRequest'
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDecisionResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/reviews/request-changes:
    post:
      tags: [review]
      operationId: requestTicketChanges
      summary: Requests changes on one Solution Form ticket (MSG17).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestChangesRequest'
      responses:
        '200':
          description: Changes requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDecisionResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/tickets/{ticketId}:
    get:
      tags: [review]
      operationId: getReviewTicket
      summary: Read-only review ticket detail in the authenticated user's authorized Projects.
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Ticket, saved Solution and Evidence references. Evidence file retrieval is external.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewTicketResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    Page:
      name: page
      in: query
      description: Page number, starting at 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Rows per page (SRS default 20).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: '"field,asc" or "field,desc"; may repeat.'
      schema:
        type: array
        items:
          type: string
  responses:
    Problem:
      description: Error (RFC 9457 Problem Details with an SRS MSG code).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    Role:
      type: string
      enum: [ADMIN, DEPARTMENT_MANAGER, PROJECT_MANAGER, STAFF]
    ProjectRole:
      type: string
      description: The user's role inside one Project.
      enum: [PROJECT_MANAGER, MEMBER]
    TicketSource:
      type: string
      enum: [SOLUTION_FORM, JIRA_IMPORT, CSV, MANUAL]
    UserSummary:
      type: object
      required: [id, fullName, email]
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
        email:
          type: string
          format: email
    ProjectMembership:
      type: object
      required: [projectId, jiraProjectKey, departmentId, departmentName, roleInProject]
      properties:
        projectId:
          type: integer
          format: int64
        jiraProjectKey:
          type: string
        departmentId:
          type: integer
          format: int64
        departmentName:
          type: string
        roleInProject:
          $ref: '#/components/schemas/ProjectRole'
    DepartmentRef:
      type: object
      required: [departmentId, name]
      properties:
        departmentId:
          type: integer
          format: int64
        name:
          type: string
    CurrentUser:
      type: object
      description: >
        The signed-in user (SRS 1.2.1). projects = Projects the user belongs to with their role in each (empty for
        Admin and Department Manager); departments = the user's Departments (from their Projects, or the ones a
        Department Manager manages).
      required: [user, role, projects, departments]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        role:
          $ref: '#/components/schemas/Role'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMembership'
        departments:
          type: array
          items:
            $ref: '#/components/schemas/DepartmentRef'
    ProjectRef:
      type: object
      required: [projectId, name]
      properties:
        projectId:
          type: integer
          format: int64
        name:
          type: string
    ReviewQueueItem:
      type: object
      required: [ticketId, sourceTicketId, title, project, source, enteredQueueAt, reviewDueDate]
      properties:
        ticketId:
          type: integer
          format: int64
        sourceTicketId:
          type: string
          description: The Jira issue key, e.g. ITSUP-1031.
        title:
          type: string
        project:
          $ref: '#/components/schemas/ProjectRef'
        source:
          $ref: '#/components/schemas/TicketSource'
        authorName:
          type: [string, 'null']
          description: T-Solve user, or the Jira assignee name; may be empty.
        enteredQueueAt:
          type: string
          format: date-time
        reviewDueDate:
          type: string
          format: date-time
    PageMetadata:
      type: object
      description: Spring Data PagedModel metadata.
      required: [size, number, totalElements, totalPages]
      properties:
        size:
          type: integer
        number:
          type: integer
          description: Current page, starting at 0.
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    ReviewQueuePage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ReviewQueueItem'
        page:
          $ref: '#/components/schemas/PageMetadata'
    TicketIdList:
      type: object
      required: [ticketIds]
      properties:
        ticketIds:
          type: array
          items:
            type: integer
            format: int64
    ApproveTicketsRequest:
      type: object
      required: [ticketIds]
      properties:
        ticketIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
    RejectTicketsRequest:
      type: object
      required: [ticketIds, reason]
      properties:
        ticketIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Stored in Review History and queued for email to the writer.
    RequestChangesRequest:
      type: object
      required: [ticketId, comment]
      properties:
        ticketId:
          type: integer
          format: int64
          minimum: 1
        comment:
          type: string
          minLength: 1
          maxLength: 1000
          description: Stored for the writer's Jira Issue Panel (MSG64) and queued for email.
    ReviewDecisionResult:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          description: Number of tickets the decision was applied to; always 1 for Request changes.
    ReviewTicketResponse:
      type: object
      required: [ticketId, sourceTicketId, title, project, source, writerId, authorName, status, enteredQueueAt, reviewDueDate, updatedAt, solution, evidence]
      properties:
        ticketId:
          type: integer
          format: int64
        sourceTicketId:
          type: string
        title:
          type: string
        project:
          $ref: '#/components/schemas/ProjectRef'
        source:
          $ref: '#/components/schemas/TicketSource'
        writerId:
          type: string
        authorName:
          type: string
        status:
          type: string
          enum: [PENDING_REVIEW, CHANGES_REQUESTED, PUBLISHED, REJECTED, UNPUBLISHED, EXPIRED]
        enteredQueueAt:
          type: string
          format: date-time
        reviewDueDate:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        reviewComment:
          type: [string, 'null']
        solution:
          $ref: '#/components/schemas/SolutionSections'
        evidence:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/SavedEvidenceReference'
    SolutionSections:
      type: object
      properties:
        symptoms:
          type: [string, 'null']
        rootCause:
          type: [string, 'null']
        resolutionSteps:
          type: [string, 'null']
        workaround:
          type: [string, 'null']
        scopeOfApplicability:
          type: [string, 'null']
    SavedEvidenceReference:
      type: object
      required: [evidenceId, name, mediaType, sizeBytes]
      properties:
        evidenceId:
          type: string
        name:
          type: string
        mediaType:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 10485760
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
          description: SRS message code, e.g. MSG47.
        params:
          type: object
          additionalProperties:
            type: [string, number]
    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details (Spring ProblemDetail) plus the SRS message code.
      required: [status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: SRS message code, e.g. MSG47. Missing or unknown = the web app shows MSG06.
        params:
          type: object
          description: Values for the message template, e.g. {"department_name":"IT"}.
          additionalProperties:
            type: [string, number]
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
