# Dependabot: security updates only (DevOps design §2, guideline 11 §5).
# Versions are locked: `open-pull-requests-limit: 0` on every entry turns off routine version-update PRs,
# while Dependabot security updates (a repo setting: Settings → Advanced Security) still open a PR when
# a dependency has a known vulnerability. Do not add `ignore: "*"` — ignore rules also block security
# updates. PR titles look like "chore(deps): bump …": no Jira key, which the PR-title check allows for
# Dependabot.
# Ecosystems are added when their files exist: docker for /backend with the backend Dockerfile (KAN-9).
version: 2
updates:
  # ---- repo root: the git hook tools (husky, lint-staged, commitlint) ----
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope

  # ---- frontend: npm packages ----
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # TypeScript stays on ~6.0: typescript-eslint supports TS < 6.1 (FE decision log).
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # ---- frontend: the two base images in frontend/Dockerfile ----
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The Node major follows frontend/.nvmrc (24 LTS); change both together, by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # ---- backend: Maven ----
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Moving to Spring Boot 4 is a team decision (backend baseline), not an automatic bump.
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]

  # ---- GitHub Actions used by .github/workflows (pinned by commit SHA) ----
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci
      include: scope
