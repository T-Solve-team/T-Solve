# Checks that look at the pull request itself, not at one part of the code (DevOps design §2, §3.2).
#   pr-title  the title must pass commitlint (commitlint.config.mjs): squash merge makes the title the
#             commit on main. Editing the title re-runs this check; no new push is needed.
#   gitleaks  scans every commit of the PR for secrets. The pre-commit hook does the same on each
#             laptop; this catches commits made without the hook. A leaked secret must be ROTATED:
#             removing it from git is not enough.
# Dependabot PRs ("chore(deps): bump …") have no Jira key, so pr-title is skipped for them. A skipped
# job reports success, so both jobs can be required checks.
name: PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # Root tools only (commitlint). --ignore-scripts: git hooks are not needed in CI.
      - name: Install (npm ci)
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }} # passed as data, never pasted into the script
        run: |
          echo "PR title: $TITLE"
          if ! printf '%s\n' "$TITLE" | npx --no -- commitlint; then
            echo "::error title=PR title::Rename the PR to: type(scope): summary (KAN-123), e.g. feat(review): add the reject popup (KAN-42). Saving the new title re-runs this check."
            exit 1
          fi

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums file.
      # To upgrade: change both lines together.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, so every commit of the PR can be scanned
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan the PR's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks version
          # Only the commits this PR adds (on the branch, not on main). Secrets are shown as REDACTED.
          if ! gitleaks git --log-opts="${BASE_SHA}..${HEAD_SHA}" --redact --no-banner --verbose; then
            echo "::error title=gitleaks::A secret was found in this PR. Rotate it first (it is public now), then remove it from the branch. A false alarm? Add its Fingerprint line to .gitleaksignore."
            exit 1
          fi
