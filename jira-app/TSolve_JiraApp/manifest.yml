modules:
  jira:projectPage:
    - key: tsolve-ask-page
      resource: ask-tsolve
      resolver:
        endpoint: tsolve-ui-endpoint
      render: native
      title: Ask T-Solve
  jira:issueViewBackgroundScript:
    - key: tsolve-solution-form-watch
      resource: solution-form-watch
      resolver:
        endpoint: tsolve-ui-endpoint
      render: native
  jira:issuePanel:
    - key: tsolve-issue-panel
      resource: issue-panel
      resolver:
        endpoint: tsolve-ui-endpoint
      render: native
      title: T-Solve
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  trigger:
    - key: tsolve-issue-created-trigger
      endpoint: tsolve-issue-created-endpoint
      events:
        - avi:jira:created:issue
      filter:
        ignoreSelf: true
    # STORY-013: the backend calls Jira as this app, with the system token Forge sends on these calls.
    - key: tsolve-app-token-lifecycle-trigger
      endpoint: tsolve-app-token-endpoint
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app
  scheduledTrigger:
    # A system token lasts up to 4 hours; an hourly call keeps a fresh one in the backend (AC-013.1).
    - key: tsolve-app-token-hourly-trigger
      endpoint: tsolve-app-token-endpoint
      interval: hour
  endpoint:
    - key: tsolve-issue-created-endpoint
      remote: tsolve-backend
      route:
        path: /api/v1/jira-app/events/issue-created
    - key: tsolve-app-token-endpoint
      remote: tsolve-backend
      route:
        path: /api/v1/jira-app/app-token
      auth:
        appSystemToken:
          enabled: true
    - key: tsolve-ui-endpoint
      remote: tsolve-backend
remotes:
  - key: tsolve-backend
    # Placeholder: Forge manifests do not read environment variables for `baseUrl`. Set your own tunnel or the
    # staging URL here, locally only, and never commit it (see README, "Point the app at your backend").
    baseUrl: https://YOUR-TUNNEL.example
resources:
  - key: issue-panel
    path: src/frontend/panel/index.jsx
  - key: ask-tsolve
    path: src/frontend/askTsolve/index.jsx
  - key: solution-form-watch
    path: src/frontend/background/index.jsx
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/0e9fd967-781d-473e-9b2c-9388d71eafbf
