# Only ${VAR} placeholders here — no real or default values. Values come from the environment or a
# git-ignored .env file (in the working directory or the repo root); .env.example lists every name.
spring:
  application:
    name: t-solve
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": ${SMTP_CONNECT_TIMEOUT_MS:5000}
      "[mail.smtp.timeout]": ${SMTP_READ_TIMEOUT_MS:3000}
      "[mail.smtp.writetimeout]": ${SMTP_WRITE_TIMEOUT_MS:5000}
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      repositories:
        enabled: false      # nothing uses Redis repositories, so the multi-store scan is turned off
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # schema is owned by Liquibase
    properties:
      hibernate:
        jdbc:
          batch_size: 100     # imports insert thousands of rows at once
        order_inserts: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  servlet:
    multipart:
      max-file-size: 10MB     # SRS UC-21: one CSV of at most 10 MB (MSG28)
      max-request-size: 11MB

server:
  port: ${SERVER_PORT}
  # the redirect_uri of the Keycloak sign-in is the public origin behind the proxy. ForwardedHeaderFilter also trusts
  # the RFC 7239 Forwarded header and X-Forwarded-Prefix, and Caddy passes them through, so the proxy must strip or
  # overwrite Forwarded, X-Forwarded-* and X-Forwarded-Prefix (Caddy: header_up -Forwarded, header_up -X-Forwarded-Prefix,
  # and set X-Forwarded-* itself); the backend must be reachable only through it
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    csrf:
      enabled: true

logging:
  level:
    # their messages carry the values of a failed insert, i.e. ticket content (AGENTS.md §9); the services log
    # their own line with the exception type and SQLState instead
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
    org.hibernate.orm.jdbc.batch: OFF

management:
  endpoints:
    web:
      exposure:
        include: health,info

tsolve:
  worker:
    enabled: ${TSOLVE_WORKER_ENABLED:false}
    # Optional until enabled; validation rejects missing Jobs credentials without a fallback.
    jdbc-url: ${JOBS_DB_URL:}
    username: ${JOBS_DB_USER:}
    password: ${JOBS_DB_PASSWORD:}
    worker-count: ${TSOLVE_WORKER_COUNT:4}
  review:
    events:
      # Review Queue event stream: interval of the keep-alive comment (ISO-8601 duration).
      heartbeat: PT25S
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  tracker:
    jira-app-id: ${TSOLVE_JIRA_APP_ID}
    forge-jwks-uri: ${FORGE_JWKS_URI}
    # Dev and mock only: the Workspace bound when the worker enqueues a suggestion job and no Workspace is bound yet
    # (until platform binds the request's Workspace). One of TSOLVE_MOCK_ACTIVE_WORKSPACES. Empty = not bound.
    dev-workspace-id: ${TSOLVE_TRACKER_DEV_WORKSPACE_ID:}
    # Stand-in for the Workspace's Jira service account until `workspace` stores it (UC-08/09): posts the MSG80
    # suggestion comment (tracker STORY-012). Any of the three empty = no comment is posted.
    jira:
      site-url: ${JIRA_SITE_URL:}
      service-account-email: ${JIRA_SERVICE_ACCOUNT_EMAIL:}
      service-account-token: ${JIRA_SERVICE_ACCOUNT_TOKEN:}
      connect-timeout: 5s
      read-timeout: 10s
  # Central sign-in (identity). All from the environment with no default: startup fails while one is missing.
  auth:
    login-origin: ${TSOLVE_LOGIN_ORIGIN}
    admin-origin: ${TSOLVE_ADMIN_ORIGIN}
    signing-key: ${TSOLVE_SIGNING_KEY}
    google-client-id: ${GOOGLE_CLIENT_ID}
    google-client-secret: ${GOOGLE_CLIENT_SECRET}
    operator-emails: ${PLATFORM_OPERATOR_EMAILS}
    keycloak-web-client-secret: ${KEYCLOAK_WEB_CLIENT_SECRET}
  # Google's published endpoints: not our hosts and not secrets, so they carry values (tests can point them elsewhere)
  oidc:
    google:
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      issuer: https://accounts.google.com
      connect-timeout: 5s
      read-timeout: 10s
  # Until the workspace module owns Projects: "user:projectId,projectId;user:projectId", ids as UUIDs. Empty = nobody can import.
  stub:
    projects: ${TSOLVE_STUB_PROJECTS:}
    inactive-projects: ${TSOLVE_STUB_INACTIVE_PROJECTS:}
  triage:
    # Cosine similarity (0 to 1) a Solution or Wiki document needs to be a source of the AI Solution Suggestion.
    min-similarity: ${SUGGESTION_MIN_SIMILARITY:0.7}
