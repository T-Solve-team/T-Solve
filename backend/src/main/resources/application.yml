# Only ${VAR} placeholders here — no real or default values. Values come from the environment or a
# git-ignored .env file (in the working directory or the repo root); .env.example lists every name.
spring:
  application:
    name: t-solve
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": ${SMTP_CONNECT_TIMEOUT_MS:5000}
      "[mail.smtp.timeout]": ${SMTP_READ_TIMEOUT_MS:3000}
      "[mail.smtp.writetimeout]": ${SMTP_WRITE_TIMEOUT_MS:5000}
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      repositories:
        enabled: false      # nothing uses Redis repositories, so the multi-store scan is turned off
  jpa:
    database: postgresql    # named, so JPA does not connect at startup to find out (no Workspace is bound then)
    open-in-view: false
    hibernate:
      ddl-auto: validate      # schema is owned by Liquibase
    properties:
      hibernate:
        jdbc:
          batch_size: 100     # imports insert thousands of rows at once
        order_inserts: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  servlet:
    multipart:
      max-file-size: 20MB     # Services enforce 10 MB: CSV MSG28, manual Evidence MSG34, Wiki file MSG28.
      max-request-size: 101MB # Ten 10 MB Wiki files plus the metadata and multipart headers.

server:
  port: ${SERVER_PORT}
  # the redirect_uri of the Keycloak sign-in is the public origin behind the proxy. ForwardedHeaderFilter also trusts
  # the RFC 7239 Forwarded header and X-Forwarded-Prefix, and Caddy passes them through, so the proxy must strip or
  # overwrite Forwarded, X-Forwarded-* and X-Forwarded-Prefix (Caddy: header_up -Forwarded, header_up -X-Forwarded-Prefix,
  # and set X-Forwarded-* itself); the backend must be reachable only through it
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    csrf:
      enabled: true

logging:
  level:
    # their messages carry the values of a failed insert, i.e. ticket content (AGENTS.md §9); the services log
    # their own line with the exception type and SQLState instead
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
    org.hibernate.orm.jdbc.batch: OFF
    # the JDK HTTP client logs every request header at FINE, including the Jira service account's Authorization
    # header; pinned so a DEBUG root never writes it (D69)
    sun.net.www: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

tsolve:
  wiki:
    search:
      min-similarity: ${WIKI_SEARCH_MIN_SIMILARITY:0.55}
  workspace:
    secret-key: ${WORKSPACE_SECRET_KEY}
  # Registry database (platform): empty url = no Registry beans (see RegistryDataSourceConfig). Once the url is set,
  # CATALOG_SECRET_KEY (Base64 of 32 bytes) is required.
  registry:
    url: ${REGISTRY_DB_URL:}
    username: ${REGISTRY_DB_USER:}
    password: ${REGISTRY_DB_PASSWORD:}
    secret-key: ${CATALOG_SECRET_KEY}
  # The PostgreSQL server of the Workspace databases. Read where tenant routing is on (Registry configured, profile not
  # dev; see TenantDataSourceConfig), where TENANT_DB_HOST is required. pool-max is per Workspace and per process.
  tenant-db:
    host: ${TENANT_DB_HOST:}
    port: ${TENANT_DB_PORT:5432}
    pool-max: ${TENANT_DB_POOL_MAX:5}
  # File storage (STORY-007) on Garage through the S3 API. Empty endpoint = no storage beans (see StorageConfig).
  storage:
    endpoint: ${FILE_STORAGE_ENDPOINT:}
    access-key: ${FILE_STORAGE_ACCESS_KEY:}
    secret-key: ${FILE_STORAGE_SECRET_KEY:}
    bucket: ${FILE_STORAGE_BUCKET:}
    public-url-pattern: ${FILE_STORAGE_PUBLIC_URL_PATTERN:}
    url-ttl-seconds: ${FILE_STORAGE_URL_TTL_SECONDS:300}
    max-bytes: ${FILE_STORAGE_MAX_BYTES:10485760}
  worker:
    enabled: ${TSOLVE_WORKER_ENABLED:false}
    # The web process alone: queue tenant jobs (the suggestion job) for the worker process; needs outbox-enabled (BUG-342).
    web-jobs-enabled: ${TSOLVE_WORKER_WEB_JOBS_ENABLED:false}
    # Optional until enabled; validation rejects missing Jobs credentials without a fallback.
    jdbc-url: ${JOBS_DB_URL:}
    username: ${JOBS_DB_USER:}
    password: ${JOBS_DB_PASSWORD:}
    worker-count: ${TSOLVE_WORKER_COUNT:4}
    # How long a request waits for a Jobs connection before the outbox reports an outage (BUG-226).
    connection-timeout: ${TSOLVE_WORKER_CONNECTION_TIMEOUT:3s}
    email:
      interval: ${TSOLVE_WORKER_EMAIL_INTERVAL:30s}
      backoff: ${TSOLVE_WORKER_EMAIL_BACKOFF:5m,15m}
      lease: ${TSOLVE_WORKER_EMAIL_LEASE:5m}
      batch-size: ${TSOLVE_WORKER_EMAIL_BATCH_SIZE:20}
      retention: ${TSOLVE_WORKER_EMAIL_RETENTION:30d}
  review:
    events:
      # Review Queue event stream: interval of the keep-alive comment (ISO-8601 duration).
      heartbeat: PT25S
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  tracker:
    jira-app-id: ${TSOLVE_JIRA_APP_ID}
    forge-jwks-uri: ${FORGE_JWKS_URI}
    jira:
      connect-timeout: 5s
      read-timeout: 10s
  # Central sign-in (identity). All from the environment with no default: startup fails while one is missing.
  auth:
    login-origin: ${TSOLVE_LOGIN_ORIGIN}
    admin-origin: ${TSOLVE_ADMIN_ORIGIN}
    operator-emails: ${PLATFORM_OPERATOR_EMAILS}
    keycloak-web-client-secret: ${KEYCLOAK_WEB_CLIENT_SECRET}
    keycloak-console-client-secret: ${KEYCLOAK_CONSOLE_CLIENT_SECRET}
  # Until the workspace module owns Projects: "user:projectId,projectId;user:projectId", ids as UUIDs. Empty = nobody can import.
  stub:
    projects: ${TSOLVE_STUB_PROJECTS:}
    inactive-projects: ${TSOLVE_STUB_INACTIVE_PROJECTS:}
    # Jira import: "projectId:JIRAKEY,projectId:JIRAKEY". A Project without a key cannot pull from Jira (MSG50).
    jira-keys: ${TSOLVE_STUB_JIRA_KEYS:}
  triage:
    # Cosine similarity (0 to 1) a Solution or Wiki document needs to be a source of the AI Solution Suggestion.
    min-similarity: ${SUGGESTION_MIN_SIMILARITY:0.7}

---
# Keycloak provisioning of a Workspace's sign-in (AC-001.58, .60, .61). This document is active only in the `ops`
# profile, so the keys do not exist in a Workspace web process, whatever its environment holds. Empty defaults (a
# deviation from "no default", AC-001.60): with one of the three secrets empty the no-op bean is wired and one WARN
# names the missing variable; with all three set, TSOLVE_LOGIN_ORIGIN and TSOLVE_SITE_ORIGIN_TEMPLATE are validated.
spring:
  config:
    activate:
      on-profile: ops
tsolve:
  keycloak-provisioning:
    base-url: ${TSOLVE_LOGIN_ORIGIN:}
    realm: tsolve
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
    site-origin-template: ${TSOLVE_SITE_ORIGIN_TEMPLATE:}
