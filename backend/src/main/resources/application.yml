# Only ${VAR} placeholders here — no real or default values. Values come from the environment or a
# git-ignored .env file (in the working directory or the repo root); .env.example lists every name.
spring:
  application:
    name: t-solve
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # schema is owned by Liquibase
    properties:
      hibernate:
        jdbc:
          batch_size: 100     # imports insert thousands of rows at once
        order_inserts: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  port: ${SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info

tsolve:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
